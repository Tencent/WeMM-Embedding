# ToolDe evaluation configuration
# Text-to-text tool-document retrieval task
# 
# Data structure notes:
# - Queries are split into three categories: web, code, customized; each has multiple subtasks
#   e.g., web/apigen, code/xxx, customized/xxx
# - Candidates are also split into the same three categories: web, code, customized
# - Retrieval is category-constrained during evaluation:
#   web queries are retrieved only against web candidates

# Web category tasks

toolde/web/apibank:
  dataset_parser: toolde
  subset_name: web/apibank
  query_file: 
    tool-tasks/ToolDe-Queries/web/apibank/queries-00000-of-00001.parquet
  candidate_file: 
    tool-tasks/ToolDe-Candidates/web/tools-00000-of-00001.parquet
  eval_type: global

